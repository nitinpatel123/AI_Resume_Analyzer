<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register | ATS Analyzer</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI', Arial, sans-serif;
    background:radial-gradient(circle at top,#0f172a,#020617);
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

/* CARD */

.box{
    width:100%;
    max-width:400px;
    background:rgba(30,41,59,0.85);
    backdrop-filter:blur(10px);
    padding:35px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 0 30px rgba(56,189,248,0.25);
    transition:0.3s;
}

.box:hover{
    transform:translateY(-5px);
}

/* TITLE */

h2{
    color:#38bdf8;
    margin-bottom:10px;
}

.subtitle{
    color:#94a3b8;
    font-size:14px;
    margin-bottom:20px;
}

/* INPUT */

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:10px;
    outline:none;
    background:#1e293b;
    color:white;
    font-size:15px;
    transition:0.3s;
}

input:focus{
    border:1px solid #38bdf8;
    box-shadow:0 0 10px rgba(56,189,248,0.3);
}

/* BUTTON */

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,#22c55e,#16a34a);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.03);
    box-shadow:0 0 15px rgba(34,197,94,0.4);
}

/* LINK */

a{
    color:#38bdf8;
    text-decoration:none;
}

a:hover{
    text-decoration:underline;
}

.small{
    margin-top:18px;
    font-size:13px;
    color:#94a3b8;
}

/* MOBILE */

@media(max-width:480px){

    .box{
        padding:25px;
    }

    h2{
        font-size:24px;
    }

    input,
    button{
        font-size:14px;
    }
}

</style>
</head>

<body>

<div class="box">

    <h2>📝 Create Account</h2>
    <p class="subtitle">Join ATS Resume Analyzer System</p>

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Enter Username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Enter Password"
            required
        >

        <button type="submit">
            Register
        </button>

    </form>

    <p class="small">
        Already have an account?
        <a href="/login">Login here</a>
    </p>

</div>

</body>
</html>

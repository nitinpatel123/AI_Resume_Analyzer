<!DOCTYPE html>
<html>
<head>
<title>Login | ATS Analyzer</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI', Arial;
    background: radial-gradient(circle at top, #0f172a, #020617);
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* MAIN CARD */
.box{
    background: rgba(30, 41, 59, 0.85);
    backdrop-filter: blur(10px);
    padding:35px;
    border-radius:20px;
    width:100%;
    max-width:360px;
    box-shadow:0 0 30px rgba(56,189,248,0.25);
    text-align:center;
    transition:0.3s;
}

.box:hover{
    transform:translateY(-5px);
}

/* TITLE */
h2{
    color:#38bdf8;
    margin-bottom:10px;
}

p{
    color:#94a3b8;
    font-size:14px;
    margin-bottom:15px;
}

/* INPUT */
input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:10px;
    outline:none;
    background:#1e293b;
    color:white;
    font-size:15px;
}

input:focus{
    border:1px solid #38bdf8;
    box-shadow:0 0 10px rgba(56,189,248,0.3);
}

/* BUTTON */
button{
    width:100%;
    padding:12px;
    background:linear-gradient(135deg,#2563eb,#38bdf8);
    border:none;
    border-radius:10px;
    color:white;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
    transition:0.3s;
    font-size:15px;
}

button:hover{
    transform:scale(1.03);
    box-shadow:0 0 15px rgba(56,189,248,0.4);
}

/* LINKS */
a{
    color:#38bdf8;
    text-decoration:none;
}

a:hover{
    text-decoration:underline;
}

.small{
    margin-top:15px;
    font-size:12px;
    color:#94a3b8;
}

</style>

</head>

<body>

<div class="box">

    <h2>🔐 Login</h2>

    <p>Welcome back to ATS Resume Analyzer</p>

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Enter Username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Enter Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <p class="small">
        Don't have an account?
        <a href="/register">Create Account</a>
    </p>

</div>

</body>
</html>
